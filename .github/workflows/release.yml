# Release stub. Versioning runs via changesets; PUBLISHING IS NOT WIRED UP
# YET — the packages are still `"private": true` and there is no NPM_TOKEN
# secret or npm org. Until those exist this workflow only opens/updates the
# changesets "Version Packages" PR, which is safe to no-op.
#
# To enable publishing later:
#   1. Decide the npm org and flip `"private"` in the packages to publish.
#   2. Add an NPM_TOKEN repo secret.
#   3. Add `publish: pnpm changeset publish` (plus registry auth) below.
name: Release

on:
    push:
        branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
    contents: write
    pull-requests: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
              with:
                  egress-policy: audit

            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 22
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            # Opens/updates the "Version Packages" PR from pending
            # changesets. No `publish` input on purpose (see header).
            - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
              with:
                  version: pnpm changeset version
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Mention-triggered Claude: comment "@claude <ask>" on an issue, PR, or
# review thread and a Claude Code session answers or pushes changes.
#
# Inert until the ANTHROPIC_API_KEY repo secret exists (or swap in
# claude_code_oauth_token with a CLAUDE_CODE_OAUTH_TOKEN secret): the
# steps are gated on the secret and skip cleanly without it. Note the
# action also refuses to run a workflow version that differs from the
# default branch, so changes to this file only take effect once merged.
name: Claude

on:
    issue_comment:
        types: [created]
    pull_request_review_comment:
        types: [created]
    pull_request_review:
        types: [submitted]
    issues:
        types: [opened, assigned]

jobs:
    claude:
        if: |
            (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
            (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
            (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
            (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            issues: write
            id-token: write
            actions: read
        steps:
            - uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
              with:
                  egress-policy: audit

            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
              with:
                  fetch-depth: 1

            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
              if: ${{ secrets.ANTHROPIC_API_KEY != '' }}

            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
              with:
                  node-version: 22
                  cache: pnpm

            - uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1
              if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
              with:
                  anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                  # CLAUDE.md carries the repo rules; allow the quality
                  # loop so Claude can validate before pushing.
                  claude_args: |
                      --allowedTools "Bash(pnpm install),Bash(pnpm lint),Bash(pnpm -r lint),Bash(pnpm test),Bash(pnpm -r test),Bash(pnpm build),Bash(pnpm -r build),Bash(pnpm format),Bash(pnpm format:check),Bash(pnpm -r format:check)"
